# Diagnostic only (fork): reproduce stremio-bugs#2815 with the real Linux shell
# (reporter-like WebKitGTK 2.52.x, DMABUF renderer disabled).
name: diag-2815

on:
  push:
    branches:
      - diag/2815-linux-repro
  workflow_dispatch:

permissions:
  contents: read

env:
  RUNTIME_COMMIT: fc150bcbb560aebb920738976c963cbdb7f83498d583221dadd942870b1bf307

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        variant: [beta39, beta40, beta40-novt, fix]
        rep: [1, 2, 3]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Flatpak and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak xvfb dbus-x11 unzip >/dev/null
      - name: GNOME 50 runtime pinned to WebKitGTK 2.52.5, Linux shell v1.2.0 bundle
        run: |
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub org.gnome.Platform//50 >/dev/null
          gh release download v1.2.0 -R Stremio/stremio-linux-shell -p 'com.stremio.Stremio.Devel.flatpak'
          sha256sum com.stremio.Stremio.Devel.flatpak
          flatpak --user install -y --noninteractive ./com.stremio.Stremio.Devel.flatpak >/dev/null
          for attempt in 1 2 3 4 5; do
            flatpak --user update -y --noninteractive --no-related --commit="$RUNTIME_COMMIT" org.gnome.Platform//50 && break
            echo "pin attempt $attempt failed"; sleep $((attempt * 20))
          done
          flatpak --user info org.gnome.Platform//50 | grep -q "$RUNTIME_COMMIT" || { echo "PIN FAILED"; exit 1; }
      - name: Released web build
        if: matrix.variant == 'beta39' || matrix.variant == 'beta40'
        run: |
          mkdir -p out
          TAG=v5.0.0-${{ matrix.variant == 'beta39' && 'beta.39' || 'beta.40' }}
          gh release download "$TAG" -R Stremio/stremio-web -p stremio-web.zip
          mkdir site && unzip -q stremio-web.zip -d site
          if [ ! -f site/index.html ]; then mv site/*/* site/ 2>/dev/null || true; fi
          echo "web $TAG release zip" > out/web.txt
      - name: Checkout web source
        if: matrix.variant == 'beta40-novt' || matrix.variant == 'fix'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.variant == 'fix' && 'croquete1/stremio-web' || 'Stremio/stremio-web' }}
          ref: ${{ matrix.variant == 'fix' && 'fix/linux-webkit-view-transition-crash' || 'v5.0.0-beta.40' }}
          path: websrc
      - name: Build web
        if: matrix.variant == 'beta40-novt' || matrix.variant == 'fix'
        run: |
          mkdir -p out
          cd websrc
          if [ "${{ matrix.variant }}" = beta40-novt ]; then bash ../diag/novt.sh; fi
          echo "web ${{ matrix.variant }} $(git rev-parse HEAD) dirty=$(git status --porcelain | wc -l)" > ../out/web.txt
          npx -y pnpm@11.8.0 install --frozen-lockfile >/dev/null
          npx -y pnpm@11.8.0 build >/dev/null
          cp -r build ../site
      - name: Run shell (${{ matrix.variant }})
        run: bash diag/run.sh site ${{ matrix.variant }}-${{ matrix.rep }} flatpak
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-2815-${{ matrix.variant }}-${{ matrix.rep }}
          path: out

  native:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [beta40, fix]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build shell v1.2.0 natively (Arch, distro WebKitGTK)
        run: |
          git clone -q --depth 1 -b v1.2.0 https://github.com/Stremio/stremio-linux-shell shell
          docker run --rm -v "$PWD/shell:/src" -v "$PWD/diag:/diag" -w /src archlinux:latest bash /diag/build-native.sh
          mv shell/nativebin nativebin
          docker build -q -t stremio-native -f diag/Dockerfile.native diag
      - name: Released web build
        if: matrix.variant == 'beta40'
        run: |
          mkdir -p out
          gh release download v5.0.0-beta.40 -R Stremio/stremio-web -p stremio-web.zip
          mkdir site && unzip -q stremio-web.zip -d site
          if [ ! -f site/index.html ]; then mv site/*/* site/ 2>/dev/null || true; fi
          echo "web v5.0.0-beta.40 release zip" > out/web.txt
      - name: Checkout web source
        if: matrix.variant == 'fix'
        uses: actions/checkout@v4
        with:
          repository: croquete1/stremio-web
          ref: fix/linux-webkit-view-transition-crash
          path: websrc
      - name: Build web
        if: matrix.variant == 'fix'
        run: |
          mkdir -p out
          cd websrc
          echo "web fix $(git rev-parse HEAD)" > ../out/web.txt
          npx -y pnpm@11.8.0 install --frozen-lockfile >/dev/null
          npx -y pnpm@11.8.0 build >/dev/null
          cp -r build ../site
      - name: Run native shell (${{ matrix.variant }})
        run: for rep in 1 2 3; do bash diag/run.sh site native-${{ matrix.variant }}-$rep native; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-2815-native-${{ matrix.variant }}
          path: out
